services:
  - type: web
    name: ai-coding-wiki-backend
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/wiki_server.py --db-mode required --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
